const TAU=Math.PI*2,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;

function mm(a,b){let r=new Float32Array(16);for(let j=0;j<4;j++)for(let i=0;i<4;i++)for(let k=0;k<4;k++)r[j*4+i]+=a[k*4+i]*b[j*4+k];return r;}
function transform(p,s=[1,1,1],r=0){const c=Math.cos(r),q=Math.sin(r);return new Float32Array([c*s[0],0,-q*s[0],0,0,s[1],0,0,q*s[2],0,c*s[2],0,...p,1]);}

function perspective(fov,aspect,near,far){const f=1/Math.tan(fov/2),n=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*n,-1,0,0,2*far*near*n,0]);}
function ortho(l,r,b,t,n,f){return new Float32Array([2/(r-l),0,0,0,0,2/(t-b),0,0,0,0,-2/(f-n),0,-(r+l)/(r-l),-(t+b)/(t-b),-(f+n)/(f-n),1]);}
function lookAt(eye,target,up=[0,1,0]){const z=V.norm(V.sub(eye,target)),x=V.norm(V.cross(up,z)),y=V.cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-V.dot(x,eye),-V.dot(y,eye),-V.dot(z,eye),1]);}

function localPoint(p,base,rot){const c=Math.cos(rot),s=Math.sin(rot);return [base[0]+p[0]*c+p[2]*s,base[1]+p[1],base[2]-p[0]*s+p[2]*c];}
function raySphere(o,d,c,r){const oc=V.sub(o,c),b=V.dot(oc,d),h=b*b-V.dot(oc,oc)+r*r;if(h<0)return Infinity;const t=-b-Math.sqrt(h);return t>0?t:Infinity;}
function rayBox(o,d,min,max){let lo=-Infinity,hi=Infinity;for(let i=0;i<3;i++){if(Math.abs(d[i])<1e-9){if(o[i]<min[i]||o[i]>max[i])return Infinity;continue;}let a=(min[i]-o[i])/d[i],b=(max[i]-o[i])/d[i];lo=Math.max(lo,Math.min(a,b));hi=Math.min(hi,Math.max(a,b));}return hi>=Math.max(lo,0)?Math.max(lo,0):Infinity;}
const rgb=h=>typeof h==='string'?[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255):h;

/* General two-terminal circuit graph. CPU float64; 240 Hz backward Euler.
   Teaching models: PWL LEDs + series resistance, finite wire/source resistance,
   10 nS stabilization per node. Not SPICE or a hardware safety tool. */
class CircuitWorld {
 constructor(){this.parts=[];this.wires=[];this.time=0;this.nextId=1;this.error='';this.residual=0;this.iterations=0;this.compiled=false;this.events=[];this.recoveryClock=0;}
 add(type,extra={}){if(this.parts.length>=24)throw Error('24 MODULE LIMIT');const id='M'+this.nextId++;const defaults={battery:5,resistor:220,capacitor:.01,led:1.85,switch:1,junction:0};if(!(type in defaults))throw Error('Unknown module');const p={id,type,value:defaults[type],on:true,color:0,capV:0,v:0,i:0,stress:0,failed:false,peak:0,age:0,failAge:0,safeFor:0,safeCurrent:0,reviveFlash:0,pos:[0,1,0],rot:0,...extra};this.parts.push(p);this.compiled=false;return p;}
 remove(id){this.parts=this.parts.filter(p=>p.id!==id);this.wires=this.wires.filter(w=>!w.a.startsWith(id+':')&&!w.b.startsWith(id+':'));this.compiled=false;}
 validPin(k){const [id,pin]=k.split(':');return this.parts.some(p=>p.id===id)&&['0','1'].includes(pin);}
 connect(a,b){if(!this.validPin(a)||!this.validPin(b)||a===b)return null;if(this.wires.length>=48)return null;if(this.wires.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)))return null;const w={id:'W'+this.nextId++,a,b,i:0,v:0};this.wires.push(w);this.compiled=false;return w;}
 disconnect(id){this.wires=this.wires.filter(w=>w.id!==id);this.compiled=false;}
 compile(){this.keys=[];for(const p of this.parts)this.keys.push(p.id+':0',p.id+':1');this.index=new Map(this.keys.map((k,i)=>[k,i]));this.n=this.keys.length;this.x=new Float64Array(this.n);this.A=new Float64Array(this.n*this.n);this.b=new Float64Array(this.n);this.work=new Float64Array(this.n*(this.n+1));for(const p of this.parts){p.a=this.index.get(p.id+':0');p.b=this.index.get(p.id+':1');}for(const w of this.wires){w.na=this.index.get(w.a);w.nb=this.index.get(w.b);}this.compiled=true;}
 stamp(a,b,g,j=0){const n=this.n,A=this.A,B=this.b;A[a*n+a]+=g;A[b*n+b]+=g;A[a*n+b]-=g;A[b*n+a]-=g;B[a]-=j;B[b]+=j;}
 solve(){const n=this.n,w=this.work,stride=n+1;for(let i=0;i<n;i++){for(let j=0;j<n;j++)w[i*stride+j]=this.A[i*n+j];w[i*stride+n]=this.b[i];}

 }
 build(dt,active,trialFailed=null){this.A.fill(0);this.b.fill(0);for(let i=0;i<this.n;i++)this.A[i*this.n+i]=1e-8;

 // Pure candidate solve: trialFailed temporarily models failed LEDs as healthy.
 // It never commits candidate voltages, currents or capacitor state. The real
 // open-circuit network is solved again after each recovery audit.
 calculate(dt,trialFailed=null){
  const enabled=p=>p.type==='led'&&(!p.failed||trialFailed?.has(p.id));

   this.build(dt,active,trialFailed);x=this.solve();let changed=false;
   for(const p of this.parts)if(enabled(p)){

    else if(is&&v<p.value-1e-8){active.delete(p.id);changed=true;}
   }
   iterations=it+1;
   if(!changed){converged=true;break;}
  }

   let s=-this.b[i];for(let j=0;j<this.n;j++)s+=this.A[i*this.n+j]*x[j];

 step(dt=1/240){if(!this.compiled)this.compile();if(!this.n){this.time+=dt;return true;}

   const failed=this.parts.filter(p=>p.type==='led'&&p.failed);
   for(const p of failed){p.failAge+=dt;p.stress=Math.max(0,p.stress-dt*1.2);}

   // actual network. This prevents zero open-circuit current being mistaken
   // for a safe environment, and also catches stored capacitor charge.
   if(failed.length){
    this.recoveryClock+=dt;

     const elapsed=this.recoveryClock;this.recoveryClock=0;
     let trial=null;
     try{trial=this.calculate(dt,new Set(failed.map(p=>p.id)));}
     catch(e){ // A failed safety probe cannot certify the circuit as safe.

     }
     if(trial)for(const p of failed){
      const wouldConduct=Math.max(0,(trial.x[p.a]-trial.x[p.b]-p.value)/8);

      p.safeFor=wouldConduct<.026?p.safeFor+elapsed:0; // 26mA recovery < 30mA stress threshold

       p.failed=false;p.stress=0;p.failAge=0;p.safeFor=0;
       p.reviveFlash=1;p.peak=0;
       this.events.push({type:'recovery',id:p.id,current:wouldConduct,time:this.time});
      }
     }
    }
   }else this.recoveryClock=0;
   const {x,residual,iterations}=this.calculate(dt);
   this.iterations=iterations;this.residual=residual;this.x=x;this.error='';
   for(const w of this.wires){w.v=x[w.na]-x[w.nb];w.i=w.v/.03;}
   for(const p of this.parts){p.v=x[p.a]-x[p.b];switch(p.type){
    case 'battery':p.i=p.on?(p.v-p.value)/12:p.v*1e-9;break;
    case 'resistor':p.i=p.v/p.value;break;
    case 'capacitor':p.i=p.value/(dt+.5*p.value)*(p.v-p.capV);p.capV+=p.i*dt/p.value;break;
    case 'switch':p.i=p.v/(p.on?.08:1e9);break;
    case 'junction':p.i=p.v/.03;break;
    case 'led':p.i=p.failed?0:Math.max(0,(p.v-p.value)/8);break;
   }
    p.peak=Math.max(p.peak,Math.abs(p.i));p.age+=dt;
    if(p.type==='led'&&!p.failed){
     const over=Math.abs(p.i)/.03;
     p.stress=Math.max(0,p.stress+dt*(over>1?Math.min(.7,(over*over-1)*.16):-.26));
     if(p.stress>=1){
      p.failed=true;p.stress=1;p.failAge=0;p.safeFor=0;p.safeCurrent=Infinity;
      this.events.push({type:'failure',id:p.id,current:p.i,time:this.time});
     }
    }
   }
   this.time+=dt;return true;
  }catch(e){this.error=e.message;return false;}
 }
 resetEnergy(){for(const p of this.parts){p.capV=0;p.stress=0;p.failed=false;p.peak=0;p.v=0;p.i=0;p.failAge=0;p.safeFor=0;p.safeCurrent=0;p.reviveFlash=0;}this.time=0;this.events=[];this.compiled=false;this.recoveryClock=0;}
 save(){return {version:1,nextId:this.nextId,time:this.time,parts:this.parts.map(p=>{const {a,b,...q}=p;return JSON.parse(JSON.stringify(q));}),wires:this.wires.map(w=>({id:w.id,a:w.a,b:w.b}))};}

// Instanced WebGL2 renderer. Geometry, glyphs, materials and effects are procedural.
function makeGeometry(kind){const v=[];const tri=(a,b,c,na,nb=na,nc=na)=>v.push(...a,...na,...b,...nb,...c,...nc);const quad=(a,b,c,d,n)=>{tri(a,b,c,n);tri(a,c,d,n)};
 if(kind==='box'){for(let axis=0;axis<3;axis++)for(const sign of [-1,1]){let u=(axis+1)%3,w=(axis+2)%3,points=[];for(const [x,y] of [[-1,-1],[1,-1],[1,1],[-1,1]]){let p=[0,0,0];p[axis]=sign*.5;p[u]=x*.5;p[w]=y*.5;points.push(p);}let n=[0,0,0];n[axis]=sign;if(sign<0)points.reverse();quad(...points,n);}}
 if(kind==='round'){const N=6,rad=.1;for(let axis=0;axis<3;axis++)for(const sign of [-1,1]){const u=(axis+1)%3,w=(axis+2)%3;const point=(i,j)=>{let p=[0,0,0];p[axis]=sign*.5;p[u]=i/N-0.5;p[w]=j/N-0.5;let q=p.map(a=>clamp(a,-.5+rad,.5-rad)),n=V.norm(V.sub(p,q));return [V.add(q,V.mul(n,rad)),n]};for(let i=0;i<N;i++)for(let j=0;j<N;j++){let q=[point(i,j),point(i+1,j),point(i+1,j+1),point(i,j+1)];if(sign<0)q.reverse();tri(q[0][0],q[1][0],q[2][0],q[0][1],q[1][1],q[2][1]);tri(q[0][0],q[2][0],q[3][0],q[0][1],q[2][1],q[3][1]);}}}
 if(['sphere','dome','flame','bead'].includes(kind)){const nx=kind==='bead'?8:20,ny=kind==='bead'?6:12;const sample=(i,j)=>{const a=i/nx*TAU,t=j/ny*Math.PI*(kind==='dome'?.5:1);let n=[Math.sin(t)*Math.cos(a),Math.cos(t),Math.sin(t)*Math.sin(a)],p=V.mul(n,.5);if(kind==='flame'){const y=j/ny;p=[Math.sin(t)*Math.cos(a)*.5*(.2+.8*y),.5-y,Math.sin(t)*Math.sin(a)*.5*(.2+.8*y)];}return [p,n]};for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const a=sample(i,j),b=sample(i+1,j),c=sample(i+1,j+1),d=sample(i,j+1);tri(a[0],c[0],b[0],a[1],c[1],b[1]);tri(a[0],d[0],c[0],a[1],d[1],c[1]);}}

 return new Float32Array(v);}
const VS3=`#version 300 es

layout(location=0)in vec3 p;layout(location=1)in vec3 norm;layout(location=2)in mat4 model;layout(location=6)in vec4 tint;layout(location=7)in vec4 param;

const FS3=`#version 300 es
precision highp float;
