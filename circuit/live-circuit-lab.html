/* CURRENT 01 — small transient circuit core. Original code, MIT.
   Two unknowns: capacitor node (v) and LED anode (d).
   Backward Euler capacitor companion + damped Newton diode solve, float64.
   This is a teaching model, not a validated hardware-design simulator. */
class Circuit {
  constructor() {
    this.vs=5; this.rc=220; this.rl=470; this.c=0.0047;
    this.ledVf=1.9; this.ledEnabled=true; this.on=false;
    this.time=0; this.v=0; this.d=0; this.i=0; this.ic=0; this.is=0;
    this.energy=0; this.residual=0; this.iterations=0; this.failed=false;
    this.h=0.0005; this.gleak=0;
  }
  reset(){this.time=0;this.v=0;this.d=0;this.i=0;this.ic=0;this.is=0;this.energy=0;this.residual=0;this.failed=false;}
  // Exponential diode calibrated to ledVf at 10 mA. No thermal/breakdown model.
  diode(d){const a=this.ledVf/Math.log1p(0.01/1e-12), e=Math.exp(Math.min(40,Math.max(-40,d/a)));return [1e-12*(e-1),1e-12*e/a];}
  step(dt=this.h){
    const old=this.v, gc=this.c/dt, gs=this.on?1/this.rc:0;
    const gr=this.ledEnabled?1/this.rl:0, A=gc+gs+gr+this.gleak;
    const b=gc*old+gs*this.vs;
    let d=this.d, it=0, residual=0, converged=!this.ledEnabled;
    if(this.ledEnabled){
      let lo=0, hi=Math.max(old,this.on?this.vs:0,1e-10);
      d=Math.max(lo,Math.min(hi,d));
      for(it=0;it<48;it++){
        const v=(b+gr*d)/A, [id,gd]=this.diode(d);
        const f=gr*(d-v)+id;
        if(Math.abs(f)<1e-12){converged=true;break;}
        if(f>0)hi=d;else lo=d;
        const deriv=gr*(1-gr/A)+gd;
        let next=d-f/Math.max(deriv,1e-18);
        if(next<=lo || next>=hi || !Number.isFinite(next))next=(lo+hi)*0.5;
        d=next;
      }
    }else d=0;
    const v=(b+gr*d)/A, i=gr*(v-d), is=gs*(this.vs-v), ic=gc*(v-old);
    residual=Math.max(Math.abs(is-i-ic-this.gleak*v),this.ledEnabled?Math.abs(i-this.diode(d)[0]):0);
    if(!converged || !Number.isFinite(v) || !Number.isFinite(i) || residual>1e-8){this.failed=true;return false;}
    this.v=Math.max(0,v);this.d=d;this.i=Math.max(0,i);this.is=is;this.ic=ic;
    this.energy=0.5*this.c*v*v;this.time+=dt;this.residual=residual;this.iterations=it+1;
    return true;
  }
  snapshot(){return {t:this.time,v:this.v,d:this.d,i:this.i,is:this.is,ic:this.ic,energy:this.energy,on:this.on,residual:this.residual,failed:this.failed};}
}

const WGSL=`
struct U {size:vec2<f32>, pad:vec2<f32>}; @group(0) @binding(0) var<uniform> u:U;
struct V { @builtin(position) pos:vec4<f32>, @location(0) p:vec2<f32>,

 @location(3) @interpolate(flat) color:vec4<f32>, @location(4) @interpolate(flat) opts:vec4<f32> };
@vertex fn vs(@builtin(vertex_index) vi:u32,@location(0) b:vec4<f32>,@location(1) s:vec4<f32>,@location(2) c:vec4<f32>,@location(3) o:vec4<f32>)->V{

 var v:V; let p=b.xy+corners[vi]*b.zw;v.pos=vec4(p.x/u.size.x*2.-1.,1.-p.y/u.size.y*2.,0.,1.);

}
@fragment fn fs(v:V)->@location(0) vec4<f32>{

 if(kind<0.5){let q=abs(v.p-v.box.xy)-v.shape.xy+vec2<f32>(v.opts.y);d=length(max(q,vec2(0.)))+min(max(q.x,q.y),0.)-v.opts.y;}
 else if(kind<1.5){d=length(v.p-v.box.xy)-v.opts.y;}
 else if(kind<2.5){let pa=v.p-v.shape.xy;let ba=v.shape.zw-v.shape.xy;let h=clamp(dot(pa,ba)/max(dot(ba,ba),0.0001),0.,1.);d=length(pa-ba*h)-v.opts.y;}

 if(kind>2.5){let r=length((v.p-v.box.xy)/vec2<f32>(v.opts.y));a=exp(-r*r*5.)*(1.-smoothstep(0.7,1.,r))*v.color.a;}
 return vec4(v.color.rgb,a);
}`;
const GLVS=`#version 300 es
precision highp float;uniform vec2 uSize;
layout(location=0)in vec4 aBox;layout(location=1)in vec4 aShape;layout(location=2)in vec4 aColor;layout(location=3)in vec4 aOpts;
out vec2 p;flat out vec4 box;flat out vec4 shape;flat out vec4 color;flat out vec4 opts;
void main(){vec2 corners[6]=vec2[6](vec2(-1,-1),vec2(1,-1),vec2(-1,1),vec2(-1,1),vec2(1,-1),vec2(1,1));
p=aBox.xy+corners[gl_VertexID]*aBox.zw;gl_Position=vec4(p.x/uSize.x*2.-1.,1.-p.y/uSize.y*2.,0,1);box=aBox;shape=aShape;color=aColor;opts=aOpts;}`;
const GLFS=`#version 300 es
precision highp float;in vec2 p;flat in vec4 box;flat in vec4 shape;flat in vec4 color;flat in vec4 opts;out vec4 frag;
void main(){float d=0.;float kind=opts.x;
if(kind<.5){vec2 q=abs(p-box.xy)-shape.xy+opts.y;d=length(max(q,vec2(0)))+min(max(q.x,q.y),0.)-opts.y;}
else if(kind<1.5)d=length(p-box.xy)-opts.y;
else if(kind<2.5){vec2 pa=p-shape.xy,ba=shape.zw-shape.xy;float h=clamp(dot(pa,ba)/max(dot(ba,ba),.0001),0.,1.);d=length(pa-ba*h)-opts.y;}
else {float r=length((p-box.xy)/opts.y);frag=vec4(color.rgb,exp(-r*r*5.)*(1.-smoothstep(.7,1.,r))*color.a);return;}
float aa=max(fwidth(d),.45);frag=vec4(color.rgb,(1.-smoothstep(-aa,aa,d))*color.a);}`;

}
function loop(now){const dt=lastNow?Math.max(0,(now-lastNow)/1000):0;lastNow=now;avgFrame=avgFrame*.96+dt*1000*.04;advance(dt);render();requestAnimationFrame(loop);}
function hitAt(x,y){return [...hits].reverse().find(h=>x>=h.x&&y>=h.y&&x<=h.x+h.w&&y<=h.y+h.h);}
function pointer(e){const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)/scale;mouse.y=(e.clientY-r.top)/scale;hover=hitAt(mouse.x,mouse.y);canvas.style.cursor=hover?(hover.slider?'ew-resize':'pointer'):'default';}
function bindInputs(){
 canvas.addEventListener('pointermove',e=>{pointer(e);if(drag?.slider)sliderValue(drag.slider,mouse.x,drag.rail);});
 canvas.addEventListener('pointerdown',e=>{pointer(e);const h=hitAt(mouse.x,mouse.y);if(!h)return;e.preventDefault();canvas.focus({preventScroll:true});focusId=h.id;if(h.slider){drag=h;sliderValue(h.slider,mouse.x,h.rail);canvas.setPointerCapture(e.pointerId);}else h.action();});
 canvas.addEventListener('pointerup',()=>{if(drag?.slider?.id==='c')flash('CAPACITANCE EDITED / VOLTAGE PRESERVED');drag=null;});canvas.addEventListener('pointercancel',()=>drag=null);
 canvas.addEventListener('pointerleave',()=>{if(!drag){mouse={x:-100,y:-100};hover=null;}});
 document.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const idx=hits.findIndex(h=>h.id===focusId);focusId=hits[(idx+(e.shiftKey?-1:1)+hits.length)%hits.length]?.id;return;}
  if(e.key==='Escape'){showHelp=false;focusId=null;return;}
  if(showHelp){if(e.key==='Enter'||e.key===' '){showHelp=false;e.preventDefault();}return;}
  const k=e.key.toLowerCase();if(e.repeat&&[' ','p','a','r','h','?'].includes(k)){e.preventDefault();return;}if(k===' '){e.preventDefault();togglePower();}else if(k==='p')togglePause();else if(k==='a'){pulse=!pulse;started=true;if(!pulse)sim.on=false;}
  else if(k==='r')resetAll();else if(k==='h'||k==='?')showHelp=!showHelp;
  else if(k==='enter'){hits.find(h=>h.id===focusId)?.action();}
  else if(['arrowleft','arrowright','arrowup','arrowdown'].includes(k)){const h=hits.find(h=>h.id===focusId);if(h?.slider){e.preventDefault();const s=h.slider,dir=(k==='arrowright'||k==='arrowup')?1:-1;let t=s.log?Math.log(sim[s.id]/s.min)/Math.log(s.max/s.min):(sim[s.id]-s.min)/(s.max-s.min);sliderValue(s,h.rail.x+h.rail.w*clamp(t+dir*.025,0,1),h.rail);}}
 });
 window.addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{lastNow=performance.now();clockRemainder=0;});
}
function fail(message){const el=document.getElementById('boot');el.hidden=false;el.textContent='CURRENT could not start. '+message+'\nTry enabling browser hardware acceleration, then reopen this file.';console.error(message);}
async function boot(){
 try{canvas=document.getElementById('circuit');gpu=await new GPUDraw(canvas).init();canvas=gpu.canvas;gpu.onError=(m)=>{paused=true;fail(m);};resize();bindInputs();document.getElementById('boot').hidden=true;
  window.CircuitLab={sim,getState:()=>({...sim.snapshot(),paused,pulse,started,backend:gpu.backend,maxResidual,solverCount,frames,avgFrame,history:history.length,primitiveCount:gpu.n,realTimeRatio:avgRate}),
   testAdvance(seconds){started=true;const n=Math.ceil(seconds/sim.h);for(let j=0;j<n;j++)advance(sim.h);render();return this.getState();},
   reset:resetAll,togglePower,togglePause,preset,changeLed,setValue(id,value){const s=sliders.find(s=>s.id===id);if(!s)throw Error('Unknown parameter '+id);sim[id]=clamp(value,s.min,s.max);},
   getHits:()=>hits.map(({id,x,y,w,h})=>({id,x:x*scale,y:y*scale,w:w*scale,h:h*scale})),render,
   exportState:()=>JSON.stringify({version:1,vs:sim.vs,rc:sim.rc,rl:sim.rl,c:sim.c,led:ledIndex,measurements:sim.snapshot()},null,2)};
  initialReady=true;render();requestAnimationFrame(loop);
 }catch(e){fail(e.stack||String(e));}
}
boot();

</script></body></html>
