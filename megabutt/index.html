<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07121c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307121c'/%3E%3Cpath d='M7 24V8h4l5 8 5-8h4v16h-5v-8l-4 6-4-6v8z' fill='%2366ffbf'/%3E%3C/svg%3E">
  <meta name="description" content="MEGABUTT: a 3D arena survival game and seeded Rust / wgpu / WebAssembly stress test.">
  <title>MEGABUTT</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #07121c; }
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0" aria-label="MEGABUTT 3D arena. WASD to move, Space to jump, Shift to dash, C to slide, right-drag to orbit, Tab to change view, H for controls."></canvas>
  <script type="module">
    import init, { start, snapshot, simulate, take_export, take_capture } from './pkg/megabutt.js?v=0.4.2';
    const canvas = document.querySelector('canvas');
    const download = (url, name) => {
      const a = document.createElement('a'); a.href = url; a.download = name; a.click();
      if (url.startsWith('blob:')) setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    try {
      await init({ module_or_path: new URL('./pkg/megabutt_bg.wasm?v=0.4.2', import.meta.url) }); await start();
      window.megabutt = { snapshot: () => JSON.parse(snapshot()), simulate: (count, frames, seed) => JSON.parse(simulate(count, frames, seed)) };
      document.documentElement.dataset.status = 'ready';
      canvas.focus();
      function hostTick() {
        if (take_export()) download(URL.createObjectURL(new Blob([JSON.stringify(JSON.parse(snapshot()).report, null, 2)], { type: 'application/json' })), 'megabutt-report.json');
        if (take_capture()) canvas.toBlob(blob => { if (blob) download(URL.createObjectURL(blob), 'megabutt-capture.png'); });
        requestAnimationFrame(hostTick);
      }
      requestAnimationFrame(hostTick);
    } catch (error) {
      document.documentElement.dataset.status = 'error';
      console.error('MEGABUTT startup failed. A WebGPU browser is required.', error);
    }
  </script>
</body>
</html>
