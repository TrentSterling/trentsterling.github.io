<!DOCTYPE html>
<html lang="en" data-tront-theme-editor data-tront-theme-surface="grid">
<head>
    <!-- Keep legacy mixed-case GitHub Pages links working; run before rendering. -->
    <script>
        (function () {
            // Site-repo folders + every repo-Pages project mount (repo names,
            // exact case). Regen: ls -d */ in site repo, plus
            // gh api "users/TrentSterling/repos?per_page=100" --paginate --jq '.[] | select(.has_pages) | .name'
            var ROUTES = ["assets", "audiobounce", "blog", "calm", "colony", "ducktoy",
                "device-history", "discord", "games", "img", "jennsfarm",
                "lofigen", "megabunk", "notesdash", "powershellmanager",
                "runtimecsg", "snapscan", "toaster", "trontcloud",
                "DungeonGen", "eos-native", "fishnet-eos-native", "campfire",
                "catswarm", "chirpy", "craftmine", "critters",
                "csharp-gentle-formatter", "dungeonprocgen", "eos-sdk",
                "floatingorigin", "grid", "lerp", "monke", "pachinko",
                "pixeljam", "punk", "quantumvibes", "shortpath", "spaceview",
                "spatialhash", "speedslap", "spheres", "splitter", "sudoku",
                "terrainarray", "text2pdf", "threejs-volumetric-beam",
                "tronteq", "trontsnap", "tutorials", "vibebeats", "vibebounce",
                "vibecar", "vibecraft", "vibeduders", "vibemaze", "vibepong",
                "vibeprime", "vibesand", "vibespace", "vibestar",
                "vibevoxelprobes", "vibewater", "wolfenstein"];
            var MAP = {};
            for (var i = 0; i < ROUTES.length; i++) MAP[ROUTES[i].toLowerCase()] = ROUTES[i];
            var parts = location.pathname.split("/");
            var first = parts[1] || "";
            var canonical = MAP[first.toLowerCase()];
            if (canonical && canonical !== first) {
                parts[1] = canonical;
                location.replace(parts.join("/") + location.search + location.hash);
            }
        })();
    </script>
    <!-- Google tag (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-27SVZGYHZ3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-27SVZGYHZ3');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0f1218">
    <title>Page Not Found (404) | Tront</title>
    <meta name="description" content="That page isn't here. Return to Trent Sterling's games, technical writing, or community.">
    <link rel="icon" href="/favicon.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- The same shared Color Magic and navbar used by Home and Discord. -->
    <link rel="stylesheet" href="/assets/css/tront-theme-editor.css">
    <link rel="stylesheet" href="/assets/css/tront-navbar.css">
    <style>
        * { box-sizing: border-box; }
        html { min-height: 100%; }
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            padding: 76px 16px 20px;
            display: flex;
            flex-direction: column;
            font-family: 'Inter', system-ui, sans-serif;
            line-height: 1.55;
        }
        .error-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(90deg, var(--te-grid-x, #263447) 1px, transparent 1px),
                linear-gradient(var(--te-grid-y, #2a2e48) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: .35;
            pointer-events: none;
            z-index: 0;
        }
        .error-main {
            flex: 1;
            display: grid;
            place-items: center;
            position: relative;
            z-index: 1;
            width: 100%;
        }
        .error-panel {
            width: min(100%, 640px);
            padding: clamp(28px, 6vw, 52px);
            text-align: center;
            border: 1px solid var(--te-line, #56606f);
            border-top: 3px solid var(--te-accent, #c9d8f0);
            border-radius: 16px;
            background: var(--te-panel-fill, #171c25);
            color: var(--te-ink, #f5f7fa);
            box-shadow: 0 16px 44px rgba(0, 0, 0, .18);
            backdrop-filter: blur(var(--te-blur, 6px));
            -webkit-backdrop-filter: blur(var(--te-blur, 6px));
        }
        .error-avatar {
            display: block;
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 2px solid var(--te-line, #56606f);
            border-radius: 50%;
            margin: 0 auto 12px;
        }
        .error-eyebrow {
            margin: 0;
            color: var(--te-secondary, #d7c9f0);
            font: 700 .75rem/1.6 'Fira Code', monospace;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .error-code {
            margin: 0;
            font: 700 clamp(4.5rem, 13vw, 7rem)/1.12 'Fira Code', monospace;
            letter-spacing: -.07em;
            color: var(--te-accent, #c9d8f0);
            font-variant-numeric: tabular-nums;
        }
        .error-title {
            margin: 4px 0 12px;
            font-size: clamp(1.4rem, 4vw, 2rem);
            line-height: 1.25;
            color: var(--te-ink, #f5f7fa);
        }
        .error-description {
            max-width: 43ch;
            margin: 0 auto 28px;
            color: var(--te-muted, #cad3e0);
            font-size: 1rem;
        }
        .error-links {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        html[data-tront-theme-editor] .error-panel .error-links a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 105px;
            min-height: 43px;
            padding: 10px 17px;
            border: 1px solid var(--te-line, #56606f);
            border-radius: 9px;
            background: var(--te-elem, #212833);
            color: var(--te-ink, #f5f7fa);
            text-decoration: none;
            font-weight: 600;
            transition: background .16s, transform .16s;
        }
        html[data-tront-theme-editor] .error-panel .error-links a:hover {
            background: var(--te-hover, #2c3541);
            color: var(--te-ink, #f5f7fa);
            transform: translateY(-1px);
        }
        html[data-tront-theme-editor] .error-panel .error-links a.primary {
            background: var(--te-button, linear-gradient(135deg,#334155,#292334));
            border-color: var(--te-accent, #c9d8f0);
            color: var(--te-ink, #f5f7fa);
        }
        .error-footer {
            margin: 26px 0 0;
            color: var(--te-muted, #cad3e0);
            font: 500 .74rem/1.7 'Fira Code', monospace;
            overflow-wrap: anywhere;
        }
        @media (max-width: 480px) {
            body { padding: 72px 10px 12px; }
            .error-panel { padding: 28px 18px; }
            .error-links { gap: 8px; }
            html[data-tront-theme-editor] .error-panel .error-links a {
                flex: 1 1 calc(50% - 8px);
                min-width: 0;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            html[data-tront-theme-editor] .error-panel .error-links a { transition: none; }
            html[data-tront-theme-editor] .error-panel .error-links a:hover { transform: none; }
        }
    </style>
    <script src="/assets/js/tront-system.js"></script>
    <script src="/assets/js/tront-theme-editor.js"></script>
</head>
<body>
    <div class="error-grid" aria-hidden="true"></div>
    <nav id="magic-navbar-container" aria-label="Primary">
        <button id="tront-theme-btn" class="nav-link" type="button" hidden><span class="theme-icon">🌙</span><span class="theme-label"> Dark</span></button>
        <a href="/discord/" class="nav-link">Discord</a>
        <a href="/blog/" class="nav-link">Blog</a>
        <a href="/games/" class="nav-link">Games</a>
        <a href="/" class="nav-link home-link">
            <img src="/blog/assets/img/tront.png" alt="Tront Logo" class="logo-image">
            <span>Home</span>
        </a>
    </nav>
    <main id="main" class="error-main">
        <section class="error-panel" aria-labelledby="error-title">
            <img src="/blog/assets/img/tront.png" alt="" class="error-avatar" width="60" height="60">
            <p class="error-eyebrow">Tront / Route not found</p>
            <p class="error-code" aria-hidden="true">404</p>
            <h1 id="error-title" class="error-title">This page isn't here.</h1>
            <p class="error-description">The link might have moved, or the project may have a new address. You can still browse my games, development notes, and community.</p>
            <div class="error-links" aria-label="Useful destinations">
                <a class="primary" href="/">Home</a>
                <a href="/games/">Games</a>
                <a href="/blog/">Blog</a>
                <a href="/discord/">Discord</a>
            </div>
            <p class="error-footer">404 / ERR_NOT_FOUND</p>
        </section>
    </main>
</body>
</html>
