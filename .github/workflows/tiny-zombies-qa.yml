name: Tiny Zombies browser QA
on:
  push:
    branches: [codex/tiny-zombies-v8-browser-qa]
  workflow_dispatch:
concurrency:
  group: tiny-zombies-isolated-qa
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Verify original build hash
        run: echo "787cdb9b13b91e27313e550826580e4030ce314fb571299ec171ddf051f99349  tiny-zombies/v9-original.html" | sha256sum -c
      - name: Real browser gameplay probe
        run: |
          python3 -m http.server 8080 >/tmp/tiny-zombies-http.log 2>&1 &
          node scripts/tiny-zombies-render-matrix.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-zombies-browser-evidence
          path: tiny-zombies-qa/
