name: Tiny Zombies browser QA
on:
  push:
    branches: [codex/tiny-zombies-v8-browser-qa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Verify original build hash
        run: echo "fde14468461cf2e44fd2871f5c43428153f1e0f02dc3af3005625a2f1109a407  tiny-zombies/index.html" | sha256sum -c
      - name: Real browser gameplay probe
        run: |
          python3 -m http.server 8080 >/tmp/tiny-zombies-http.log 2>&1 &
          node scripts/tiny-zombies-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-zombies-browser-evidence
          path: tiny-zombies-qa/
