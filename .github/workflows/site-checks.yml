name: Site browser checks

on:
  pull_request:
    branches: [master]
    paths:
      - index.html
      - 404.html
      - sitemap-pages.xml
      - hardpoint/**
      - crumplecar/index.html
      - colony/index.html
      - jennsfarm/index.html
      - tools/seo/**
      - discord/**
      - games/**
      - assets/css/tront-theme*.css
      - assets/js/tront-theme*.js
      - assets/js/tront-system.js
      - assets/css/tront-navbar.css
      - assets/css/tront-system.css
      - style/**
      - minecraft-modding/**
      - tools/navigation/**
      - assets/css/tront-about-discovery.css
      - assets/js/tront-about-discovery.js
      - tools/about-discovery/**
      - tools/theme-editor/**
      - tools/game-media/verify.cjs
      - tools/game-media/games-resilience.cjs
      - tools/game-media/resilience*.cjs
      - tools/game-media/isaac-archive.cjs
      - tools/game-media/isaac-archive.test.cjs
      - tools/game-media/server.cjs
      - .github/workflows/site-checks.yml

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  browser-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
      THEME_BASELINE_ROOT: ${{ github.workspace }}/.local/theme-baseline
      THEME_SCREENSHOTS: ${{ github.workspace }}/.local/theme-review
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read the current base for content and gallery regression checks
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          path: .local/theme-baseline
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned test tooling and official Chrome
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/site-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/site-tests/node_modules/playwright/cli.js" install --with-deps chrome
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
          mkdir -p .local/theme-review
          echo "NODE_PATH=$RUNNER_TEMP/site-tests/node_modules" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/site-tests/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Check 404 recovery and additive breadcrumb metadata
        run: node --test tools/seo/*.test.cjs
      - name: Verify sitemap and canonical game metadata
        run: node tools/seo/check.cjs
      - name: Check copy and gallery source preservation
        run: node tools/theme-editor/preserve.cjs
      - name: Test opt-in About discovery component contracts
        run: node --test tools/about-discovery/test.cjs
      - name: Decode CraftMine and each eligible random preview in Chrome
        run: timeout 180s node tools/about-discovery/media-decode.cjs
      - name: Test reviewed Isaac archive media contracts
        run: node --test tools/game-media/isaac-archive.test.cjs
      - name: Test Games font readiness and source preservation
        run: node --test tools/game-media/resilience.test.cjs
      - name: Test Games stalled-font resilience in the browser
        run: timeout 120s node tools/game-media/resilience-browser.cjs
      - name: Check primary navigation contracts and exact production preservation
        run: node --test tools/navigation/*.test.cjs
      - name: Check navigation before and after on current page families
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: timeout 240s node tools/navigation/browser.cjs
      - name: Test theme math and state contracts
        run: node --test tools/theme-editor/test.cjs
      - name: Test rendered themes and native browser controls
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: timeout 300s node tools/theme-editor/browser.cjs
      - name: Run the unchanged gallery browser suite
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: timeout 180s node tools/game-media/verify.cjs
      - name: Save local-only review screenshots and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-browser-review-${{ github.event.pull_request.number }}
          path: |
            .local/theme-review/*.png
            .local/theme-review/*.json
            .local/gallery-*.png
            .local/gallery-verification.json
            .local/gallery-playback-load.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  blog-consumer-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .local/blog-consumer
    env:
      BLOG_BASELINE_ROOT: ${{ github.workspace }}/.local/blog-consumer
      BLOG_SCREENSHOTS: ${{ github.workspace }}/.local/blog-review
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
    steps:
      - name: Check out the exact shared-editor candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read released blog consumer without changing it
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: TrentSterling/blog
          ref: 2ae3d69c7874755a0448032750c3f1267413431d
          path: .local/blog-consumer
          persist-credentials: false
      # Preserve the blog's real historical negative control; the PR base is current.
      - name: Read historical blog theme negative-control fixture
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: TrentSterling/blog
          ref: 7f0471eba88b129331ae13404876f621ec62db37
          path: .local/blog-legacy-theme
          persist-credentials: false
      - name: Read shared assets at the PR base for the consumer comparison
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .local/shared-base
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /assets/css/tront-theme-editor.css
            /assets/css/tront-navbar.css
            /assets/js/tront-theme-editor.js
            /assets/js/tront-system.js
      - name: Set up the blog's existing pinned Ruby tooling
        uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: .local/blog-consumer
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build the unchanged blog with candidate and released shared assets
        run: |
          node --test tools/theme-review/test.cjs tools/theme-review/heading.test.cjs tools/theme-review/sidebar-focus.test.cjs
          bundle exec ruby tools/test_unique_post_urls.rb
          JEKYLL_ENV=production bundle exec jekyll b -d _site/blog
          python3 tools/check_seo.py _site/blog
          mkdir -p _baseline
          cp -R _site/blog _baseline/blog
          JEKYLL_ENV=production bundle exec jekyll b --source "$GITHUB_WORKSPACE/.local/blog-legacy-theme" --config "$GITHUB_WORKSPACE/.local/blog-legacy-theme/_config.yml" -d _legacy/blog
          mkdir -p _site/assets/css _site/assets/js _baseline/assets/css _baseline/assets/js _legacy/assets/css _legacy/assets/js
          for file in css/tront-theme-editor.css css/tront-navbar.css js/tront-theme-editor.js js/tront-system.js; do
            cp "$GITHUB_WORKSPACE/assets/$file" "_site/assets/$file"
            cp "$GITHUB_WORKSPACE/.local/shared-base/assets/$file" "_baseline/assets/$file"
            cp "$GITHUB_WORKSPACE/.local/shared-base/assets/$file" "_legacy/assets/$file"
          done
      - name: Install pinned browser tooling and official Chrome
        id: blog-browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/blog-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0 pngjs@7.0.0
          node "$RUNNER_TEMP/blog-tests/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/blog-tests/node_modules" >> "$GITHUB_ENV"
      - name: Check current blog mobile sidebar keyboard focus
        if: ${{ !cancelled() && steps.blog-browser-tools.outcome == 'success' }}
        run: timeout 180s node tools/theme-review/sidebar-focus.cjs
      - name: Run existing blog child-route and contrast checks
        if: ${{ !cancelled() && steps.blog-browser-tools.outcome == 'success' }}
        run: timeout 600s node tools/theme-review/browser.cjs
      - name: Test rapid modal reuse in the built blog consumer
        if: ${{ !cancelled() && steps.blog-browser-tools.outcome == 'success' }}
        run: timeout 90s node "$GITHUB_WORKSPACE/tools/theme-editor/blog-close.cjs"
      - name: Save public blog consumer review screenshots and reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blog-consumer-review-${{ github.event.pull_request.number }}
          path: |
            .local/blog-review/*.png
            .local/blog-review/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

