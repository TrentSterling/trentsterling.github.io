name: Public site first-paint audit
on:
  pull_request:
    paths:
      - tools/paint-audit/**
      - .github/workflows/paint-audit.yml
permissions:
  contents: read
concurrency:
  group: paint-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
      PAINT_AUDIT_OUTPUT: .local/paint-audit
      PAINT_AUDIT_ROUTES: tools/paint-audit/core-routes.json
      PAINT_HTTP_ROUTES: tools/paint-audit/http-routes.json
      PAINT_EXPECT_MAIN_ROOT: .local/main-expected
      PAINT_EXPECT_MONKE_ROOT: .local/monke-expected
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Read exact expected main deployment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: TrentSterling/trentsterling.github.io
          ref: 6afc1a3c367a59e52ec97cbb6aaa98ed20938d9e
          path: .local/main-expected
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /discord/index.html
            /games/index.html
            /assets/js/tront-theme-editor.js
            /assets/css/tront-theme-editor.css
      - name: Read exact expected Monke deployment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: TrentSterling/monke
          ref: f1d810c384c4a4a83f416bcbdd197ef920378fff
          path: .local/monke-expected
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /index.htm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate capture analysis
        run: node --test tools/paint-audit/test.cjs
      - name: Compare public bytes and inspect all main-repository page statuses
        run: timeout 180s node tools/paint-audit/http-verify.cjs
      - name: Install existing pinned tooling and official Chrome
        if: ${{ !cancelled() }}
        id: browser-tools
        run: |
          npm install --prefix "$RUNNER_TEMP/paint-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0
          node "$RUNNER_TEMP/paint-tests/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/paint-tests/node_modules" >> "$GITHUB_ENV"
      - name: Record actual public first-paint behavior
        if: ${{ !cancelled() && steps.browser-tools.outcome == 'success' }}
        run: timeout 420s node tools/paint-audit/capture.cjs
      - name: Retain bounded diagnostic artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: first-paint-audit-${{ github.event.pull_request.number }}
          path: .local/paint-audit/**
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
