name: Scoped marketing navbar proof
on:
  push:
    branches: [diagnostic/marketing-navbar-proof]
permissions:
  contents: read
jobs:
  marketing-navbar-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      THEME_BROWSER_EXECUTABLE: /opt/google/chrome/chrome
      THEME_BASELINE_ROOT: ${{ github.workspace }}/.local/theme-baseline
      THEME_SCREENSHOTS: ${{ github.workspace }}/.local/marketing-proof
    steps:
      - name: Check out the frozen reviewed candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: f5f8b0ffaf7867bed8474047d629dca4bf6ea270
          persist-credentials: false
      - name: Check out its actual released base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 957cc37c72ca47b9bde139dfc189f3f4d2f45b8c
          path: .local/theme-baseline
          persist-credentials: false
      - name: Set up pinned Node action
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the existing pinned browser toolchain
        run: |
          npm install --prefix "$RUNNER_TEMP/site-tests" --no-save --package-lock=false --ignore-scripts playwright@1.62.0 pngjs@7.0.0
          node "$RUNNER_TEMP/site-tests/node_modules/playwright/cli.js" install --with-deps chrome
          echo "NODE_PATH=$RUNNER_TEMP/site-tests/node_modules" >> "$GITHUB_ENV"
      - name: Verify the frozen tree and exact source contracts
        run: |
          test "$(git rev-parse HEAD)" = f5f8b0ffaf7867bed8474047d629dca4bf6ea270
          test "$(git rev-parse HEAD^{tree})" = f4dae9ebf018ab075580d431e6602d52250cf06c
          node --test tools/navigation/legacy-navbar.test.cjs tools/navigation/contract.test.cjs
      - name: Run only the two marketing consumers through the unchanged browser assertions
        run: |
          timeout 300s node <<'NODE'
          const assert = require('node:assert/strict');
          const contract = require('./tools/navigation/legacy-navbar.cjs');
          assert.deepEqual(contract.files, ['runtimecsg/index.html','toaster/index.html','notesdash/index.html','snapscan/index.html','megabunk/index.html','trontcloud/index.html']);
          // Diagnostic selection only. The checked-out harness and release branch stay unchanged.
          contract.files.splice(0, contract.files.length, 'megabunk/index.html', 'trontcloud/index.html');
          require('./tools/navigation/legacy-navbar-browser.cjs');
          NODE
      - name: Verify scoped report completeness and zero runtime activity
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict'), fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync(process.env.THEME_SCREENSHOTS + '/legacy-navbar-report.json'));
          assert.equal(r.status, 'passed'); assert.equal(r.cases.length, 70);
          assert.equal(r.keyboard.length, 14); assert.equal(r.noScript.length, 4);
          assert.equal(r.interceptedDestinations.length, 72);
          assert.equal(r.runtimeRequests, 0); assert.equal(r.downloads, 0);
          assert.deepEqual([...new Set(r.cases.map(c => c.file))], ['megabunk/index.html','trontcloud/index.html']);
          r.diagnosticScope = 'Only two marketing consumers; interrupted full CI is not represented as passed.';
          r.reviewedHead = 'f5f8b0ffaf7867bed8474047d629dca4bf6ea270';
          fs.writeFileSync(process.env.THEME_SCREENSHOTS + '/legacy-navbar-report.json', JSON.stringify(r,null,2));
          NODE
      - name: Preserve scoped evidence even if an assertion fails
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scoped-marketing-navbar-proof
          path: .local/marketing-proof/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
