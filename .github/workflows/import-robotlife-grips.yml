name: Stage verified Robot Life grips
on:
  push:
    branches: [deploy/robotlife-grips]
    paths: ['.github/workflows/import-robotlife-grips.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Import approved compiled runtime only
        env:
          PUBLIC_RUNTIME_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-82a4-81f5-8201-9f14e6a11409/raw?se=2026-11-03T20%3A31%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=36a265f6-8699-5fe5-8d73-74585e46e8fa&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-03T12%3A59%3A15Z&ske=2026-11-04T12%3A59%3A15Z&sks=b&skv=2026-02-06&sig=USP2JnLryKoLEz9WU9MXz8weheNVYNsXJvBBheFhRnw%3D'
        run: |
          python3 - <<'PY'
          import os,io,json,hashlib,zipfile,urllib.request
          from pathlib import Path
          old=Path('robotlife/index.html').read_bytes()
          assert hashlib.sha256(old).hexdigest()=='81e55f87ad6986c776c079e073e35919b3df0e74f97858234eeb5193a96609d0','Concurrent runtime change'
          with urllib.request.urlopen(os.environ['PUBLIC_RUNTIME_URL'],timeout=60) as r:data=r.read(2000000)
          assert hashlib.sha256(data).hexdigest()=='617c24edc445fe0cc80c0631d8bcff9f2dfe5fd5c1e803dd1d210b8d0ff0fac1'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert sorted(z.namelist())==['LICENSES.txt','build.json','index.html']
              html=z.read('index.html')
              assert hashlib.sha256(html).hexdigest()=='f360d5460d37a0b1bbb640d44b32845e74e8943e8db443e5f4ef0293597293d0'
              meta=json.loads(z.read('build.json'))
              assert meta['sourceCommit']=='cbba7429c81c52ff348dff453ec493df02d8f65d'
              for name in z.namelist():(Path('robotlife')/name).write_bytes(z.read(name))
          print('Imported exact tested runtime:',len(html),'bytes')
          PY
      - name: Checkpoint runtime files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- robotlife
          git commit -m 'Update Robot Life with fitted utensil and object hand poses'
          git push origin HEAD:deploy/robotlife-grips
