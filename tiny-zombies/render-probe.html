const canvas=document.getElementById('game');canvas.width=width;canvas.height=height;
const report=window.__RENDER_PROBE__={mode,target,width,height,frames,state:'starting',events:[],errors:[],completedFrames:0};
function log(type,value){report.events.push({type,time:Math.round(performance.now()),value});document.getElementById('report').textContent=JSON.stringify(report,null,2);console.log('TZ_RENDER_PROBE',type,JSON.stringify(value));}
function failed(e){const s=e?.stack||e?.message||String(e);report.errors.push(s);report.state='failed';log('error',s);}
window.addEventListener('error',e=>failed(e.error||e.message));
window.addEventListener('unhandledrejection',e=>failed(e.reason));
function fontData(){const input=atob(payload.compressedFont),a=new Uint8Array(128*48*48);let i=0,j=0;while(i<input.length){const b=input.charCodeAt(i++);if(b>=128){let n=b-127,v=input.charCodeAt(i++);a.fill(v,j,j+n);j+=n;}else{for(let n=b+1;n>0;n--)a[j++]=input.charCodeAt(i++);}}if(j!==a.length)throw Error('Font length mismatch '+j);return a;}
async function main(){
 if(!navigator.gpu)throw Error('WebGPU unavailable');
 const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)throw Error('No adapter');
 report.adapter={vendor:adapter.info.vendor,architecture:adapter.info.architecture,description:adapter.info.description};
 const device=await adapter.requestDevice();
 device.addEventListener('uncapturederror',e=>failed(e.error));
 device.lost.then(x=>{report.state='device-lost';log('device-lost',{reason:x.reason,message:x.message});});
 const format=q.get('format')||navigator.gpu.getPreferredCanvasFormat();report.format=format;
 const context=canvas.getContext('webgpu');context.configure({device,format,alphaMode:'opaque'});
 function buffer(label,size,usage,data){const b=device.createBuffer({label,size,usage});if(data)device.queue.writeBuffer(b,0,data);return b;}
 function storage(label,size,data){return buffer(label,size,GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST|GPUBufferUsage.COPY_SRC,data);}
 async function module(label,code){const m=device.createShaderModule({label,code}),info=await m.getCompilationInfo();for(const v of info.messages)log('shader-message',{label,type:v.type,line:v.lineNum,message:v.message});if(info.messages.some(v=>v.type==='error'))throw Error(label+' did not compile');return m;}
 const hdr=device.createTexture({label:'synthetic HDR resolve',size:[width,height],format:'rgba16float',usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.TEXTURE_BINDING});
 const offscreen=target==='offscreen'?device.createTexture({label:'ordinary output texture',size:[width,height],format,usage:GPUTextureUsage.RENDER_ATTACHMENT|GPUTextureUsage.COPY_SRC}):null;
 const init=device.createCommandEncoder();const p=init.beginRenderPass({colorAttachments:[{view:hdr.createView(),loadOp:'clear',storeOp:'store',clearValue:{r:.24,g:.55,b:1.1,a:1}}]});p.end();device.queue.submit([init.finish()]);await device.queue.onSubmittedWorkDone();log('synthetic-hdr-ready',true);
 let postPipeline,postBG,uiPipeline,uiBG,glyphCount=0;
 if(mode==='post'||mode==='both'){
  const m=await module('exact V9 tone map',payload.post);
  postPipeline=await device.createRenderPipelineAsync({label:'tone mapping',layout:'auto',vertex:{module:m,entryPoint:'vs'},fragment:{module:m,entryPoint:'fs',targets:[{format}]},primitive:{topology:'triangle-list'}});
  postBG=device.createBindGroup({layout:postPipeline.getBindGroupLayout(0),entries:[{binding:0,resource:hdr.createView()},{binding:1,resource:device.createSampler({magFilter:'linear',minFilter:'linear'})}]});
 }
 if(mode==='ui'||mode==='both'){
  const bytes=new ArrayBuffer(2048*48),f=new Float32Array(bytes),u=new Uint32Array(bytes);
  function glyph(x,y,w,h,col,code){let i=glyphCount++*12;f.set([x,y,w,h,...col],i);u[i+8]=code;}
  const selection=q.get('glyphs')||'all';
  if(selection!=='text')glyph(width*.2,height*.25,width*.6,height*.5,[.012,.031,.041,.78],128);
  if(selection!=='rect'){const text='TINY ZOMBIES V9';for(let i=0;i<text.length;i++)glyph(width*.25+i*31,height*.40,48,48,[.94,.97,.93,1],text.charCodeAt(i));}
  const glyphs=storage('GPU glyphs',bytes.byteLength,bytes),font=fontData(),atlas=storage('SDF glyph distance atlas',font.byteLength,font);
  const O=storage('voxel occupancy',payload.occWords*4),S=storage('GPU player and weapons',16384),Paint=storage('sparse persistent floor blood',payload.paintWords*4),C=storage('counters',384),H=storage('zombie grid heads and links',payload.zHeadWords*4);
  const U=buffer('UI size and map goals',48,GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST,new Float32Array([width,height,0,0,-48,8,12,-28,-64,52,48,32]));
  const m=await module('exact V9 GPU glyphs',payload.ui);
  uiPipeline=await device.createRenderPipelineAsync({label:'SDF GPU interface pipeline',layout:'auto',vertex:{module:m,entryPoint:'vs'},fragment:{module:m,entryPoint:'fs',targets:[{format,blend:{color:{srcFactor:'src-alpha',dstFactor:'one-minus-src-alpha',operation:'add'},alpha:{srcFactor:'one',dstFactor:'one-minus-src-alpha',operation:'add'}}}]},primitive:{topology:'triangle-list'}});
  const buffers=[U,glyphs,atlas,O,S,Paint,C,H];uiBG=device.createBindGroup({layout:uiPipeline.getBindGroupLayout(0),entries:buffers.map((b,binding)=>({binding,resource:{buffer:b}}))});
 }
 report.state='ready';report.glyphCount=glyphCount;log('ready',true);
 async function draw(){
  if(report.errors.length||report.state==='device-lost')return;
  const encoder=device.createCommandEncoder({label:'render-only '+mode});
  const view=(offscreen||context.getCurrentTexture()).createView();
  const pass=encoder.beginRenderPass({label:'tone map and GPU glyphs',colorAttachments:[{view,clearValue:{r:0,g:0,b:0,a:1},loadOp:'clear',storeOp:'store'}]});
  if(postPipeline){pass.setPipeline(postPipeline);pass.setBindGroup(0,postBG);pass.draw(3);}
  if(uiPipeline){pass.setPipeline(uiPipeline);pass.setBindGroup(0,uiBG);pass.draw(6,glyphCount);}
  pass.end();log('submit',report.completedFrames+1);device.queue.submit([encoder.finish()]);
  await device.queue.onSubmittedWorkDone();
  if(report.errors.length||report.state==='device-lost')return;
  report.completedFrames++;report.state=report.completedFrames===frames?'complete':'running';log('done',report.completedFrames);
  if(report.completedFrames<frames)requestAnimationFrame(()=>draw().catch(failed));
 }
 requestAnimationFrame(()=>draw().catch(failed));
}
main().catch(failed);
</script>
