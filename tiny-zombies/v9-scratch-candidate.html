fn artMotion6(group:f32,phase:f32,kind:f32,wind:f32,moving:f32,hit:f32)->vec3f {
 let amount=clamp(moving,0.0,1.0);let stride=sin(phase)*select(.10,.045,kind==6.0)*amount;
 let bob=(.5-.5*cos(phase*2.0))*.022*amount;let flinch=max(0.0,hit)*.045;
 var out=vec3f(0,bob,-flinch);let raise=select(0.0,clamp(wind/.95,0.0,1.0),kind==6.0);
 if(group==1.0){out+=vec3f(sin(phase)*.009*amount,.009*sin(phase*2.0)*amount,-.012*amount);}
 if(group==2.0){out+=vec3f(0,abs(stride)*.25+raise*.23,-stride*.55+raise*.13);}
 if(group==3.0){out+=vec3f(0,abs(stride)*.25+raise*.23,stride*.55+raise*.13);}
 if(group==4.0){out=vec3f(0,max(0.0,sin(phase))*.07*amount,-stride);}
 if(group==5.0){out=vec3f(0,max(0.0,-sin(phase))*.07*amount,stride);}
 return out;
}

fn rayBox(o:vec2f,d:vec2f,p:vec2f,h:f32)->f32 {let dd=vec2f(signNZ(d.x)*max(abs(d.x),.00001),signNZ(d.y)*max(abs(d.y),.00001));let a=(p-vec2f(h)-o)/dd;let b=(p+vec2f(h)-o)/dd;let lo=min(a,b);let hi=max(a,b);let near=max(lo.x,lo.y);let far=min(hi.x,hi.y);return select(999.0,max(0.0,near),far>=max(0.0,near));}

// All ray queries use the GPU's current occupancy and actual actor/prop AABBs.
// No framebuffer readback, CPU entity walking, or flat-height damage tests.
const RAY3 = OCC_HELP + `
struct Hit3 { t:f32, kind:u32, id:u32, n:vec3f };
fn miss3(t:f32)->Hit3 {return Hit3(t,0u,0u,vec3f(0));}
fn closer3(a:Hit3,b:Hit3)->Hit3 {if(b.kind>0u&&(a.kind==0u||b.t<a.t||(b.t==a.t&&(b.kind<a.kind||(b.kind==a.kind&&b.id<a.id))))){return b;}return a;}
fn box3(o:vec3f,d:vec3f,c:vec3f,h:vec3f,limit:f32,kind:u32,id:u32)->Hit3 {
 var near=0.0;var far=limit;var normal=vec3f(0);
 for(var axis=0u;axis<3u;axis++){
  if(abs(d[axis])<.000001){if(o[axis]<c[axis]-h[axis]||o[axis]>c[axis]+h[axis]){return miss3(limit);}}
  else{let a=(c[axis]-h[axis]-o[axis])/d[axis];let b=(c[axis]+h[axis]-o[axis])/d[axis];let lo=min(a,b);let hi=max(a,b);if(lo>=near){near=lo;normal=vec3f(0);normal[axis]=-signNZ(d[axis]);}far=min(far,hi);if(near>far){return miss3(limit);}}
 }
